# Click-to-release: Actions tab → "Release Android (RetroTrack)" → Run workflow.
# Builds a signed .aab on your main PC (TILLYTILLYCAT, the only Windows runner)
# and uploads it to Google Play's internal testing track. Promote to production
# yourself in the Play Console.
name: Release Android (RetroTrack)

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        options: [internal, alpha, beta]
        default: internal
      release_notes:
        description: What's new (optional, shown to testers)
        type: string
        required: false

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: retrotrack.app
  PACKAGE_NAME: com.bregan.retrotrack.app

jobs:
  release:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: retrotrack.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Check the Android SDK is installed
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::ANDROID_HOME is not set on this runner. Install the Android SDK (e.g. via Android Studio) and set ANDROID_HOME for the runner service."
            exit 1
          fi
          echo "Android SDK: $sdk"

      - run: npm ci

      - name: Work out the next versionCode from Google Play
        id: version
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          code=$(node ../.github/scripts/play-next-version-code.mjs "$PACKAGE_NAME")
          echo "versionCode=$code" >> "$GITHUB_OUTPUT"
          echo "Next versionCode: $code"

      - name: Set versionCode for this build (not committed)
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android = { ...app.expo.android, versionCode: Number(process.argv[1]) };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          ' "${{ steps.version.outputs.versionCode }}"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Use the upload keystore for release builds
        run: node ../.github/scripts/android-release-signing.mjs android/app/build.gradle

      - name: Write keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed app bundle
        working-directory: retrotrack.app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Release notes
        if: inputs.release_notes != ''
        env:
          NOTES: ${{ inputs.release_notes }}
        run: mkdir -p "$RUNNER_TEMP/whatsnew" && printf '%s' "$NOTES" > "$RUNNER_TEMP/whatsnew/whatsnew-en-GB"

      - name: Upload to Google Play (${{ inputs.track }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bregan.retrotrack.app
          releaseFiles: retrotrack.app/android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.versionCode }}
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: ${{ inputs.release_notes != '' && format('{0}/whatsnew', runner.temp) || '' }}

      - name: Keep the .aab as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: retrotrack-app-${{ steps.version.outputs.versionCode }}.aab
          path: retrotrack.app/android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
